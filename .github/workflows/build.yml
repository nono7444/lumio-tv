name: Build Lumio TV

# Compile l'APK Android TV à chaque push sur main et publie une Release
# (l'appli se met à jour toute seule depuis ces Releases).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Propriétés de build (aucun service Nuvio)
        run: |
          touch local.properties local.dev.properties
          {
            echo "NUVIO_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/keystore/lumio-tv.p12"
            echo "NUVIO_RELEASE_KEY_ALIAS=lumiotv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=lumiotvpass"
            echo "NUVIO_RELEASE_STORE_PASSWORD=lumiotvpass"
          } >> "$GITHUB_ENV"

      - name: Compile l'APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleFullRelease \
            -PlumioVersionCode=${{ github.run_number }} \
            -PlumioVersionName=1.0.${{ github.run_number }} \
            --stacktrace 2>&1 | tee build.log || {
            grep -E "^e: |error:" build.log | sed "s#^.*/app/src/main/java/##" | sort -u > err.txt
            # Une annotation par fichier (GitHub en garde 10), 12 erreurs max par fichier
            for f in $(cut -d: -f1 err.txt | sed 's#^e: file://##' | sort -u | head -9); do
              grep -F "$f" err.txt | head -12 > one.txt
              echo "::error title=$f::$(sed 's/%/%25/g' one.txt | awk '{printf "%s%%0A", $0}')"
            done
            exit 1
          }

      - name: Prépare les fichiers
        run: |
          mkdir out
          for f in app/build/outputs/apk/full/release/*.apk; do
            n=$(basename "$f" | sed -e 's/app-full-/lumio-tv-/' -e 's/-release//')
            cp "$f" "out/$n"
          done
          cp out/lumio-tv-universal.apk out/lumio-tv.apk
          ls -la out

      - name: Accélération matérielle de l'émulateur
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Ouvre l'appli 60 s sur une Android TV virtuelle : pas de Release si elle plante ou redémarre en boucle
      - name: Essai sur une Android TV virtuelle
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: android-tv
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/smoke-tv.sh
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lumio TV 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Lumio TV 1.0.${{ github.run_number }}
            Installation : dans Downloader sur la TV, ouvre https://github.com/${{ github.repository }}/releases/latest/download/lumio-tv-armeabi-v7a.apk (ou lumio.wawanono.lol/tv)
            Les versions suivantes se proposent toutes seules dans l'appli.
          files: |
            out/lumio-tv.apk
            out/lumio-tv-armeabi-v7a.apk
            out/lumio-tv-arm64-v8a.apk
