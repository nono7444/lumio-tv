name: Build Lumio TV

# Compile l'APK Android TV à chaque push sur main et publie une Release
# (l'appli se met à jour toute seule depuis ces Releases).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Propriétés de build (aucun service Nuvio)
        run: |
          touch local.properties local.dev.properties
          {
            echo "NUVIO_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/keystore/lumio-tv.p12"
            echo "NUVIO_RELEASE_KEY_ALIAS=lumiotv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=lumiotvpass"
            echo "NUVIO_RELEASE_STORE_PASSWORD=lumiotvpass"
          } >> "$GITHUB_ENV"

      - name: Compile l'APK
        run: |
          ./gradlew :app:assembleFullRelease \
            -PlumioVersionCode=${{ github.run_number }} \
            -PlumioVersionName=1.0.${{ github.run_number }} \
            --stacktrace

      - name: Prépare les fichiers
        run: |
          mkdir out
          for f in app/build/outputs/apk/full/release/*.apk; do
            n=$(basename "$f" | sed -e 's/app-full-/lumio-tv-/' -e 's/-release//')
            cp "$f" "out/$n"
          done
          cp out/lumio-tv-universal.apk out/lumio-tv.apk
          ls -la out

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Lumio TV 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Lumio TV 1.0.${{ github.run_number }}
            Installation : dans Downloader sur la TV, ouvre https://github.com/${{ github.repository }}/releases/latest/download/lumio-tv.apk
            Les versions suivantes se proposent toutes seules dans l'appli.
          files: |
            out/lumio-tv.apk
            out/lumio-tv-armeabi-v7a.apk
            out/lumio-tv-arm64-v8a.apk
